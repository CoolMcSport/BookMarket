<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Продать книгу — BookMarket</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #34495e;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
            font-weight: bold;
        }

        main {
            max-width: 620px;
            margin: 40px auto;
            background: white;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 22px;
            background: #27ae60;
            color: white;
            border: 0;
            border-radius: 8px;
            padding: 14px 20px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #219150;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #2c3e50;
            text-decoration: none;
        }

        .hint {
            margin-top: 6px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
    <h1>📚 BookMarket</h1>
    <p>Продажа и обмен книг</p>
</header>

<nav>
    <a href="/">Главная</a>
    <a href="/catalog.html">Каталог</a>
    <a href="/add-book.html">Продать книгу</a>
    <a href="/exchange.html">Обмен</a>
</nav>

<main>
    <h1>📖 Продать книгу</h1>

    <form
        action="/add-book"
        method="POST"
        enctype="multipart/form-data"
    >
        <label for="title">Название книги</label>
        <input
            id="title"
            type="text"
            name="title"
            placeholder="Введите название"
            required
        >

        <label for="author">Автор</label>
        <input
            id="author"
            type="text"
            name="author"
            placeholder="Введите автора"
            required
        >

        <label for="price">Цена, ₸</label>
        <input
            id="price"
            type="number"
            name="price"
            min="0"
            step="1"
            placeholder="Введите цену"
            required
        >

        <label for="description">Описание</label>
        <textarea
            id="description"
            name="description"
            placeholder="Опишите состояние книги"
        ></textarea>

        <label for="image">Фотография книги</label>
        <input
            id="image"
            type="file"
            name="image"
            accept="image/jpeg,image/png,image/webp"
        >

        <div class="hint">
            Разрешены JPG, PNG и WEBP. Максимальный размер — 5 МБ.
        </div>

        <button type="submit">
            Добавить книгу
        </button>
    </form>

    <a class="back-link" href="/">
        ← Вернуться на главную
    </a>
</main>

</body>
</html>
